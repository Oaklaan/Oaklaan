<svg xmlns="http://www.w3.org/2000/svg" width="600" height="220" viewBox="0 0 600 220" role="img" aria-label="A 3D-style fox playing hide and seek behind pine trees in a moonlit forest, saying funny lines when caught">
  <defs>
    <clipPath id="clip"><rect width="600" height="220" rx="14"/></clipPath>

    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#050b1a"/>
      <stop offset=".55" stop-color="#0d2236"/>
      <stop offset="1" stop-color="#17443d"/>
    </linearGradient>
    <radialGradient id="moonGlow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#fffbe0" stop-opacity=".6"/>
      <stop offset="1" stop-color="#fffbe0" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rayG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fffbe0" stop-opacity=".22"/>
      <stop offset="1" stop-color="#fffbe0" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="trunkG" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1f130c"/>
      <stop offset=".55" stop-color="#5a3d2a"/>
      <stop offset="1" stop-color="#9a7048"/>
    </linearGradient>
    <linearGradient id="leafG" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0b3022"/>
      <stop offset=".55" stop-color="#1f7a4d"/>
      <stop offset="1" stop-color="#63d49a"/>
    </linearGradient>
    <linearGradient id="tierShade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity=".4"/>
    </linearGradient>
    <linearGradient id="fogG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a8e6cf" stop-opacity="0"/>
      <stop offset=".6" stop-color="#a8e6cf" stop-opacity=".22"/>
      <stop offset="1" stop-color="#a8e6cf" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="groundG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1c5240"/>
      <stop offset="1" stop-color="#06140e"/>
    </linearGradient>
    <radialGradient id="headG" cx=".65" cy=".3" r=".85">
      <stop offset="0" stop-color="#ffc870"/>
      <stop offset=".5" stop-color="#f28a24"/>
      <stop offset="1" stop-color="#9a420b"/>
    </radialGradient>
    <radialGradient id="cheekG" cx=".6" cy=".3" r=".8">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e8d2b4"/>
    </radialGradient>
    <linearGradient id="earG" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffa63d"/>
      <stop offset="1" stop-color="#b24f0e"/>
    </linearGradient>
    <linearGradient id="bodyG" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8f3d0a"/>
      <stop offset=".6" stop-color="#f28a24"/>
      <stop offset="1" stop-color="#ffbf66"/>
    </linearGradient>
    <radialGradient id="vig" cx=".5" cy=".5" r=".75">
      <stop offset=".55" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity=".55"/>
    </radialGradient>

    <filter id="blur2" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="2.5"/></filter>
    <filter id="glow" x="-300%" y="-300%" width="700%" height="700%"><feGaussianBlur stdDeviation="1.6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>

    <!-- reusable pine tree, origin = centre of its base -->
    <g id="tree">
      <path d="M-15,0 Q-21,-3 -17,-14 L17,-14 Q21,-3 15,0Z" fill="url(#trunkG)"/>
      <rect x="-15" y="-80" width="30" height="70" fill="url(#trunkG)"/>
      <path d="M-6,-70 L-5,-20 M4,-76 L5,-26" stroke="#000" stroke-opacity=".25" stroke-width="1.2" fill="none"/>
      <polygon points="-38,-72 0,-120 38,-72" fill="url(#leafG)"/>
      <polygon points="-38,-72 0,-120 38,-72" fill="url(#tierShade)"/>
      <polygon points="-32,-92 0,-138 32,-92" fill="url(#leafG)"/>
      <polygon points="-32,-92 0,-138 32,-92" fill="url(#tierShade)"/>
      <polygon points="-24,-110 0,-154 24,-110" fill="url(#leafG)"/>
      <polygon points="-24,-110 0,-154 24,-110" fill="url(#tierShade)"/>
    </g>

    <style>
      .p  { animation: peekR 48s ease-in-out infinite both; }
      .pl { animation: peekL 48s ease-in-out infinite both; }
      @keyframes peekR {
        0%, 0.4%  { transform: translateX(0) rotate(0deg) scale(1); }
        2.2%, 9%  { transform: translateX(30px) rotate(9deg) scale(1.05); }
        10.6%, 100% { transform: translateX(0) rotate(0deg) scale(1); }
      }
      @keyframes peekL {
        0%, 0.4%  { transform: translateX(0) rotate(0deg) scale(1); }
        2.2%, 9%  { transform: translateX(-30px) rotate(-9deg) scale(1.05); }
        10.6%, 100% { transform: translateX(0) rotate(0deg) scale(1); }
      }
      .say { opacity: 0; animation: say 48s ease-in-out infinite both; }
      @keyframes say {
        0%, 3% { opacity: 0; transform: translateY(5px); }
        4.2%, 9% { opacity: 1; transform: translateY(0); }
        10.2%, 100% { opacity: 0; transform: translateY(-3px); }
      }
      .eye { transform-box: fill-box; transform-origin: center; animation: blink 4s infinite; }
      @keyframes blink { 0%, 90%, 100% { transform: scaleY(1); } 94% { transform: scaleY(.1); } }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 10.5px; font-weight: 700; }
      .fly { animation: glowp 3.5s ease-in-out infinite; }
      @keyframes glowp { 0%,100% { opacity: .15; } 50% { opacity: 1; } }
      .ray { animation: breathe 9s ease-in-out infinite alternate; }
      @keyframes breathe { from { opacity: .35; } to { opacity: 1; } }
      .tw { animation: glowp 4s ease-in-out infinite; }
    </style>
  </defs>

  <g clip-path="url(#clip)">
    <!-- SKY -->
    <rect width="600" height="220" fill="url(#sky)"/>
    <g fill="#fff">
      <circle class="tw" cx="40" cy="25" r="1.1"/><circle class="tw" style="animation-delay:1s" cx="130" cy="14" r=".9"/>
      <circle class="tw" style="animation-delay:2s" cx="260" cy="22" r="1.2"/><circle class="tw" style="animation-delay:.5s" cx="330" cy="12" r=".9"/>
      <circle class="tw" style="animation-delay:1.5s" cx="450" cy="24" r="1"/>
    </g>
    <circle cx="548" cy="52" r="52" fill="url(#moonGlow)"/>
    <circle cx="548" cy="52" r="16" fill="#fff8d6"/>
    <g fill="#e6dca4" opacity=".55"><circle cx="543" cy="47" r="3"/><circle cx="553" cy="57" r="2.2"/><circle cx="551" cy="44" r="1.4"/></g>

    <!-- MOON RAYS -->
    <g class="ray">
      <polygon points="545,60 556,60 410,190 300,190" fill="url(#rayG)"/>
      <polygon points="540,64 548,64 250,190 175,190" fill="url(#rayG)" opacity=".7"/>
      <polygon points="552,60 560,60 560,190 480,190" fill="url(#rayG)" opacity=".5"/>
    </g>

    <!-- FAR LAYER (slowest parallax) -->
    <g>
      <animateTransform attributeName="transform" type="translate" values="-1.5 0;1.5 0;-1.5 0" dur="12s" repeatCount="indefinite"/>
      <path d="M-10,150 Q80,112 170,142 T330,134 T500,140 T620,126 L620,180 L-10,180Z" fill="#0f2c3b"/>
      <path d="M-10,160 Q110,134 220,156 T420,150 T620,152 L620,180 L-10,180Z" fill="#0c2530"/>
      <g opacity=".55">
        <use href="#tree" transform="translate(25,172) scale(.38)"/>
        <use href="#tree" transform="translate(150,172) scale(.34)"/>
        <use href="#tree" transform="translate(300,172) scale(.4)"/>
        <use href="#tree" transform="translate(425,172) scale(.35)"/>
        <use href="#tree" transform="translate(570,172) scale(.38)"/>
      </g>
    </g>

    <!-- HORIZON FOG + GROUND -->
    <rect x="0" y="125" width="600" height="60" fill="url(#fogG)"/>
    <path d="M0,168 L600,168 L600,220 L0,220Z" fill="url(#groundG)"/>
    <g fill="#bfeedd" opacity=".07">
      <ellipse cx="400" cy="185" rx="90" ry="9"/><ellipse cx="270" cy="198" rx="70" ry="7"/><ellipse cx="480" cy="204" rx="60" ry="6"/>
    </g>
    <g stroke="#3fae76" stroke-width="1.3" stroke-linecap="round" fill="none" opacity=".6">
      <path d="M60,176 l-2,-5 M63,176 l1,-6 M66,176 l3,-4"/>
      <path d="M180,174 l-2,-5 M183,174 l1,-6 M186,174 l3,-4"/>
      <path d="M310,176 l-2,-5 M313,176 l1,-6 M316,176 l3,-4"/>
      <path d="M430,175 l-2,-5 M433,175 l1,-6 M436,175 l3,-4"/>
    </g>

    <!-- MID LAYER: back trees B and D with their foxes -->
    <g>
      <animateTransform attributeName="transform" type="translate" values="-3 0;3 0;-3 0" dur="12s" repeatCount="indefinite"/>

      <!-- tree B (x=235) -->
      <ellipse cx="205" cy="184" rx="42" ry="6" fill="#000" opacity=".4" filter="url(#blur2)"/>
      <g transform="translate(235,150) scale(.85)"><g class="pl" style="animation-delay:12s"><g class="pl" style="animation-delay:30s">
        <g transform="scale(.85)">
          <ellipse cx="0" cy="45" rx="16" ry="3.5" fill="#000" opacity=".4" filter="url(#blur2)"/>
          <path d="M-12,8 Q-17,36 -11,44 L11,44 Q17,36 12,8Z" fill="url(#bodyG)"/>
          <path d="M-5,14 Q0,36 5,14 L4,44 L-4,44Z" fill="#fff0dc"/>
          <ellipse cx="-6" cy="44" rx="4.5" ry="2.6" fill="#2a1710"/><ellipse cx="6" cy="44" rx="4.5" ry="2.6" fill="#2a1710"/>
          <polygon points="-15,-7 -11,-25 -2,-11" fill="url(#earG)"/><polygon points="15,-7 11,-25 2,-11" fill="url(#earG)"/>
          <polygon points="-12,-9 -10.5,-19 -5,-11" fill="#3a1f14"/><polygon points="12,-9 10.5,-19 5,-11" fill="#3a1f14"/>
          <ellipse rx="17" ry="14" fill="url(#headG)"/>
          <path d="M14,-8 Q18,2 10,11" stroke="#ffe0a8" stroke-width="1.4" fill="none" opacity=".6" stroke-linecap="round"/>
          <path d="M-17,2 Q-9,16 0,15 Q9,16 17,2 Q9,7 0,6 Q-9,7 -17,2Z" fill="url(#cheekG)"/>
          <g class="eye"><ellipse cx="-6.5" cy="-2" rx="2" ry="2.6" fill="#1b1209"/><circle cx="-5.8" cy="-3" r=".8" fill="#fff"/></g>
          <g class="eye"><ellipse cx="6.5" cy="-2" rx="2" ry="2.6" fill="#1b1209"/><circle cx="7.2" cy="-3" r=".8" fill="#fff"/></g>
          <ellipse cx="0" cy="9" rx="2.4" ry="1.8" fill="#1b1209"/><ellipse cx="-.6" cy="8.4" rx=".8" ry=".5" fill="#fff" opacity=".7"/>
          <path d="M-3,11.5 Q0,14 3,11.5" stroke="#1b1209" fill="none" stroke-width=".8"/>
        </g>
      </g></g></g>
      <use href="#tree" transform="translate(235,182) scale(.85)"/>

      <!-- tree D (x=490) -->
      <ellipse cx="458" cy="186" rx="44" ry="6" fill="#000" opacity=".4" filter="url(#blur2)"/>
      <g transform="translate(490,150) scale(.9)"><g class="pl" style="animation-delay:18s"><g class="pl" style="animation-delay:24s">
        <g transform="scale(.85)">
          <ellipse cx="0" cy="45" rx="16" ry="3.5" fill="#000" opacity=".4" filter="url(#blur2)"/>
          <path d="M-12,8 Q-17,36 -11,44 L11,44 Q17,36 12,8Z" fill="url(#bodyG)"/>
          <path d="M-5,14 Q0,36 5,14 L4,44 L-4,44Z" fill="#fff0dc"/>
          <ellipse cx="-6" cy="44" rx="4.5" ry="2.6" fill="#2a1710"/><ellipse cx="6" cy="44" rx="4.5" ry="2.6" fill="#2a1710"/>
          <polygon points="-15,-7 -11,-25 -2,-11" fill="url(#earG)"/><polygon points="15,-7 11,-25 2,-11" fill="url(#earG)"/>
          <polygon points="-12,-9 -10.5,-19 -5,-11" fill="#3a1f14"/><polygon points="12,-9 10.5,-19 5,-11" fill="#3a1f14"/>
          <ellipse rx="17" ry="14" fill="url(#headG)"/>
          <path d="M14,-8 Q18,2 10,11" stroke="#ffe0a8" stroke-width="1.4" fill="none" opacity=".6" stroke-linecap="round"/>
          <path d="M-17,2 Q-9,16 0,15 Q9,16 17,2 Q9,7 0,6 Q-9,7 -17,2Z" fill="url(#cheekG)"/>
          <g class="eye"><ellipse cx="-6.5" cy="-2" rx="2" ry="2.6" fill="#1b1209"/><circle cx="-5.8" cy="-3" r=".8" fill="#fff"/></g>
          <g class="eye"><ellipse cx="6.5" cy="-2" rx="2" ry="2.6" fill="#1b1209"/><circle cx="7.2" cy="-3" r=".8" fill="#fff"/></g>
          <ellipse cx="0" cy="9" rx="2.4" ry="1.8" fill="#1b1209"/><ellipse cx="-.6" cy="8.4" rx=".8" ry=".5" fill="#fff" opacity=".7"/>
          <path d="M-3,11.5 Q0,14 3,11.5" stroke="#1b1209" fill="none" stroke-width=".8"/>
        </g>
      </g></g></g>
      <use href="#tree" transform="translate(490,184) scale(.9)"/>
    </g>

    <!-- depth haze between layers -->
    <rect x="0" y="120" width="600" height="75" fill="url(#fogG)" opacity=".7"/>

    <!-- FRONT LAYER: trees A and C with their foxes -->
    <g>
      <animateTransform attributeName="transform" type="translate" values="-5 0;5 0;-5 0" dur="12s" repeatCount="indefinite"/>

      <!-- tree A (x=110) -->
      <ellipse cx="72" cy="192" rx="48" ry="7" fill="#000" opacity=".45" filter="url(#blur2)"/>
      <g transform="translate(110,152)"><g class="p" style="animation-delay:0s"><g class="p" style="animation-delay:36s">
        <g transform="scale(.85)">
          <ellipse cx="0" cy="45" rx="16" ry="3.5" fill="#000" opacity=".4" filter="url(#blur2)"/>
          <path d="M-12,8 Q-17,36 -11,44 L11,44 Q17,36 12,8Z" fill="url(#bodyG)"/>
          <path d="M-5,14 Q0,36 5,14 L4,44 L-4,44Z" fill="#fff0dc"/>
          <ellipse cx="-6" cy="44" rx="4.5" ry="2.6" fill="#2a1710"/><ellipse cx="6" cy="44" rx="4.5" ry="2.6" fill="#2a1710"/>
          <polygon points="-15,-7 -11,-25 -2,-11" fill="url(#earG)"/><polygon points="15,-7 11,-25 2,-11" fill="url(#earG)"/>
          <polygon points="-12,-9 -10.5,-19 -5,-11" fill="#3a1f14"/><polygon points="12,-9 10.5,-19 5,-11" fill="#3a1f14"/>
          <ellipse rx="17" ry="14" fill="url(#headG)"/>
          <path d="M14,-8 Q18,2 10,11" stroke="#ffe0a8" stroke-width="1.4" fill="none" opacity=".6" stroke-linecap="round"/>
          <path d="M-17,2 Q-9,16 0,15 Q9,16 17,2 Q9,7 0,6 Q-9,7 -17,2Z" fill="url(#cheekG)"/>
          <g class="eye"><ellipse cx="-6.5" cy="-2" rx="2" ry="2.6" fill="#1b1209"/><circle cx="-5.8" cy="-3" r=".8" fill="#fff"/></g>
          <g class="eye"><ellipse cx="6.5" cy="-2" rx="2" ry="2.6" fill="#1b1209"/><circle cx="7.2" cy="-3" r=".8" fill="#fff"/></g>
          <ellipse cx="0" cy="9" rx="2.4" ry="1.8" fill="#1b1209"/><ellipse cx="-.6" cy="8.4" rx=".8" ry=".5" fill="#fff" opacity=".7"/>
          <path d="M-3,11.5 Q0,14 3,11.5" stroke="#1b1209" fill="none" stroke-width=".8"/>
        </g>
      </g></g></g>
      <use href="#tree" transform="translate(110,190)"/>

      <!-- tree C (x=365) -->
      <ellipse cx="327" cy="192" rx="48" ry="7" fill="#000" opacity=".45" filter="url(#blur2)"/>
      <g transform="translate(365,152)"><g class="p" style="animation-delay:6s"><g class="p" style="animation-delay:42s">
        <g transform="scale(.85)">
          <ellipse cx="0" cy="45" rx="16" ry="3.5" fill="#000" opacity=".4" filter="url(#blur2)"/>
          <path d="M-12,8 Q-17,36 -11,44 L11,44 Q17,36 12,8Z" fill="url(#bodyG)"/>
          <path d="M-5,14 Q0,36 5,14 L4,44 L-4,44Z" fill="#fff0dc"/>
          <ellipse cx="-6" cy="44" rx="4.5" ry="2.6" fill="#2a1710"/><ellipse cx="6" cy="44" rx="4.5" ry="2.6" fill="#2a1710"/>
          <polygon points="-15,-7 -11,-25 -2,-11" fill="url(#earG)"/><polygon points="15,-7 11,-25 2,-11" fill="url(#earG)"/>
          <polygon points="-12,-9 -10.5,-19 -5,-11" fill="#3a1f14"/><polygon points="12,-9 10.5,-19 5,-11" fill="#3a1f14"/>
          <ellipse rx="17" ry="14" fill="url(#headG)"/>
          <path d="M14,-8 Q18,2 10,11" stroke="#ffe0a8" stroke-width="1.4" fill="none" opacity=".6" stroke-linecap="round"/>
          <path d="M-17,2 Q-9,16 0,15 Q9,16 17,2 Q9,7 0,6 Q-9,7 -17,2Z" fill="url(#cheekG)"/>
          <g class="eye"><ellipse cx="-6.5" cy="-2" rx="2" ry="2.6" fill="#1b1209"/><circle cx="-5.8" cy="-3" r=".8" fill="#fff"/></g>
          <g class="eye"><ellipse cx="6.5" cy="-2" rx="2" ry="2.6" fill="#1b1209"/><circle cx="7.2" cy="-3" r=".8" fill="#fff"/></g>
          <ellipse cx="0" cy="9" rx="2.4" ry="1.8" fill="#1b1209"/><ellipse cx="-.6" cy="8.4" rx=".8" ry=".5" fill="#fff" opacity=".7"/>
          <path d="M-3,11.5 Q0,14 3,11.5" stroke="#1b1209" fill="none" stroke-width=".8"/>
        </g>
      </g></g></g>
      <use href="#tree" transform="translate(365,190)"/>
    </g>

    <!-- FOREGROUND FERNS (closest, biggest sway) -->
    <g fill="#030d09">
      <animateTransform attributeName="transform" type="translate" values="-8 0;8 0;-8 0" dur="12s" repeatCount="indefinite"/>
      <path d="M-20,222 L-20,180 Q8,200 22,184 Q26,204 46,198 Q40,212 58,222Z"/>
      <path d="M560,222 Q574,206 570,198 Q590,204 596,184 Q612,200 640,180 L640,222Z"/>
    </g>

    <!-- FIREFLIES -->
    <g fill="#e9ff8a" filter="url(#glow)">
      <circle class="fly" cx="70" cy="150" r="1.8"><animate attributeName="cy" values="150;140;150" dur="5s" repeatCount="indefinite"/></circle>
      <circle class="fly" style="animation-delay:1s" cx="190" cy="165" r="1.5"><animate attributeName="cx" values="190;198;190" dur="6s" repeatCount="indefinite"/></circle>
      <circle class="fly" style="animation-delay:2s" cx="300" cy="150" r="1.8"><animate attributeName="cy" values="150;158;150" dur="4.5s" repeatCount="indefinite"/></circle>
      <circle class="fly" style="animation-delay:.5s" cx="430" cy="165" r="1.5"><animate attributeName="cx" values="430;422;430" dur="5.5s" repeatCount="indefinite"/></circle>
      <circle class="fly" style="animation-delay:1.5s" cx="560" cy="150" r="1.6"/>
      <circle class="fly" style="animation-delay:2.5s" cx="40" cy="120" r="1.4"><animate attributeName="cy" values="120;112;120" dur="6.5s" repeatCount="indefinite"/></circle>
    </g>

    <!-- VIGNETTE for depth -->
    <rect width="600" height="220" fill="url(#vig)"/>
  </g>

  <!-- SPEECH BUBBLES -->
  <g class="say" style="animation-delay:0s"><rect x="10" y="4" width="200" height="26" rx="9" fill="#fff"/><polygon points="108,30 118,30 124,38" fill="#fff"/><text class="mono" x="110" y="21" text-anchor="middle" fill="#14261d">Found me! Best of three?</text></g>
  <g class="say" style="animation-delay:6s"><rect x="265" y="4" width="200" height="26" rx="9" fill="#fff"/><polygon points="363,30 373,30 379,38" fill="#fff"/><text class="mono" x="365" y="21" text-anchor="middle" fill="#14261d">I was just buffering...</text></g>
  <g class="say" style="animation-delay:12s"><rect x="135" y="4" width="200" height="26" rx="9" fill="#fff"/><polygon points="233,30 243,30 229,38" fill="#fff"/><text class="mono" x="235" y="21" text-anchor="middle" fill="#14261d">404: fox not found. Oops.</text></g>
  <g class="say" style="animation-delay:18s"><rect x="390" y="4" width="200" height="26" rx="9" fill="#fff"/><polygon points="488,30 498,30 484,38" fill="#fff"/><text class="mono" x="490" y="21" text-anchor="middle" fill="#14261d">You win. Rematch? :)</text></g>
  <g class="say" style="animation-delay:24s"><rect x="390" y="4" width="200" height="26" rx="9" fill="#fff"/><polygon points="488,30 498,30 484,38" fill="#fff"/><text class="mono" x="490" y="21" text-anchor="middle" fill="#14261d">Not a bug, it's a feature.</text></g>
  <g class="say" style="animation-delay:30s"><rect x="135" y="4" width="200" height="26" rx="9" fill="#fff"/><polygon points="233,30 243,30 229,38" fill="#fff"/><text class="mono" x="235" y="21" text-anchor="middle" fill="#14261d">Shhh... stealth mode on.</text></g>
  <g class="say" style="animation-delay:36s"><rect x="10" y="4" width="200" height="26" rx="9" fill="#fff"/><polygon points="108,30 118,30 124,38" fill="#fff"/><text class="mono" x="110" y="21" text-anchor="middle" fill="#14261d">git blame the trees, not me</text></g>
  <g class="say" style="animation-delay:42s"><rect x="265" y="4" width="200" height="26" rx="9" fill="#fff"/><polygon points="363,30 373,30 379,38" fill="#fff"/><text class="mono" x="365" y="21" text-anchor="middle" fill="#14261d">Caught in 4K. Fine.</text></g>
</svg>
